<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda Virtual</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="assets/logo.png" type="image/png" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="assets/logo.png" alt="Logo Tienda" />
      <h1>Tienda Virtual</h1>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar productos..." />
      <button id="searchBtn">
        <img src="assets/icons/search.png" alt="Buscar" />
      </button>
    </div>

    <div class="cart-user">
      <button id="cartBtn">
        <img src="assets/icons/carrito.png" alt="Carrito" />
      </button>
      <button id="userBtn">
        <img src="assets/icons/user.png" alt="Usuario" />
      </button>
    </div>
  </header>

  <section class="banner">
    <img src="assets/banner.jpg" alt="Banner de la tienda" />
    <div class="banner-text">
      <h2>Bienvenido a la Tienda Virtual</h2>
      <p>Descubre ofertas y productos exclusivos</p>
    </div>
  </section>

  <main>
    <h2 class="section-title">Productos destacados</h2>
    <div class="products" id="productList">
      <!-- Los productos se mostrarán aquí dinámicamente -->
    </div>
  </main>

  <footer>
    <p>© 2025 Tienda Virtual. Todos los derechos reservados.</p>
  </footer>

  <!-- Archivos JavaScript -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
